  if(!noApply){ P.applyUI(); if(P.R && P.R.reader){ P.applyTheme(); P.applyType(true); } }
};
var saveSetT;
function saveSet(){
  clearTimeout(saveSetT);
  saveSetT = setTimeout(function(){ P.Store.setJSON("settings", P.gset); }, 250);
}
P.saveSet = saveSet;

var saveBooksT;
P.saveBooks = function(immediate){
  clearTimeout(saveBooksT);
  var doIt = function(){ P.Store.setJSON("books", P.books.map(strip)); };
  if(immediate) doIt(); else saveBooksT = setTimeout(doIt, 400);
};
function strip(b){
  return { id:b.id, title:b.title, author:b.author, file:b.file, size:b.size, fmt:b.fmt,
    added:b.added, lastOpen:b.lastOpen, progress:b.progress||0, pos:b.pos||{ch:0,ratio:0},
    shelves:b.shelves||[], finished:!!b.finished, ownSet:b.ownSet||null, chars:b.chars||0,
    /* Drive sync state. Without these the app forgets a book lives in the cloud,

/* ---------------- stats ---------------- */
function today(){ var d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
P.addStat = function(min){
  var s = P.stats;

  if(s.lastDay !== t){

    s.streak = (s.lastDay===yk)? (s.streak||0)+1 : 1;

  }
  if(!s.streak) s.streak = 1;
  clearTimeout(P.__statT);
  P.__statT = setTimeout(function(){ P.Store.setJSON("stats", P.stats); }, 3000);
};
function last7(){
  var out=[], i;
  for(i=6;i>=0;i--){
    var d=new Date(Date.now()-i*86400000);
    var k=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();

/* ---------------- app (chrome) themes ---------------- */
var UI_THEMES = {

    bg:"#0f1115", surf:"#181b21", surf2:"#1f232b", line:"#262a33",
    ink:"#e8e6e1", dim:"#9aa0ab", dim2:"#6d7480", acc:"#d9b56a", accInk:"#12151a" },

  /* undyed flax with a visible weave, bleached-linen cards, Bengal indigo */
  linen: { name:"Linen",
    bg:"#E2DBCB", surf:"#EFEAE0", surf2:"#D6CDBA", line:"#C6BCA6",
    ink:"#27241E", dim:"#595243", dim2:"#776E5B", acc:"#2F3F73", accInk:"#F2EEE5" },
  light: { name:"Light",
    bg:"#f6f4ef", surf:"#ffffff", surf2:"#ece9e2", line:"#dcd7cd",
    ink:"#1a1c20", dim:"#5c626d", dim2:"#868c97", acc:"#8a6216", accInk:"#ffffff" },
  royal: { name:"Royal",
    bg:"#0b1626", surf:"#122036", surf2:"#18293f", line:"#22375a",
    ink:"#eee0c2", dim:"#a3b4cc", dim2:"#71849f", acc:"#e2b75f", accInk:"#12203a" },
  blossom: { name:"Blossom",
    bg:"#fbf3f4", surf:"#ffffff", surf2:"#f5e7ea", line:"#e6d0d6",

P.uiBG = function(){ return (UI_THEMES[P.gset.ui||"bookworm"]||UI_THEMES.bookworm).bg; };

/* ---------------- accent ---------------- */
var ACCENTS = ["#2f6d4a","#d9b56a","#c98b6b","#7fa88a","#7f96c4","#b184c0","#cf7f8f"];
P.applyAccent = function(){

/* ---------------- covers ---------------- */
P.coverURL = function(rec){
  if(covers[rec.id]) return covers[rec.id];

  covers[rec.id] = g;

};
function storeCover(id, dataURL){
  if(!dataURL) return Promise.resolve();

}
function loadCovers(){

  });

}
function extractCover(book){
  try{
    if(book.coverData) return Promise.resolve(book.coverData);

    if(path && book.zip){
      var f = P.zipFile(book.zip, path);
      if(f) return f.async("base64").then(function(b64){
        var t = /\.png$/i.test(path)? "image/png" : (/\.gif$/i.test(path)? "image/gif":"image/jpeg");

    }
  }catch(e){}
  return Promise.resolve("");
}
function shrink(dataURL){
  return new Promise(function(res){
    try{
      var img = new Image();
      img.onload = function(){

          c.getContext("2d").drawImage(img,0,0,w,h);

/* ---------------- import ---------------- */
function readFile(f){
  return new Promise(function(res,rej){
    var r = new FileReader();
    r.onload = function(){ res(r.result); };
    r.onerror = function(){ rej(new Error("Could not read "+f.name)); };
    r.readAsArrayBuffer(f);
  });
}
P.importFiles = function(files){
  var list = Array.prototype.slice.call(files||[]);
  if(!list.length) return Promise.resolve();
  var okN=0, dupN=0, badN=0;
  function step(i){
    if(i>=list.length){
      P.saveBooks(true);
      P.renderLibrary();
      var msg = okN+" added";
      if(dupN) msg += " · "+dupN+" already in library";
      if(badN) msg += " · "+badN+" failed";
      P.toast(msg, 3200);
      return Promise.resolve();
    }
    var f = list[i];
    P.toast("Importing "+(i+1)+"/"+list.length+" — "+f.name, 4000);
    var dup = P.books.filter(function(b){ return b.file===f.name && Math.abs((b.size||0)-f.size)<32; })[0];
    if(dup){ dupN++; return step(i+1); }
    return readFile(f).then(function(buf){
      return P.openBuffer(buf, {name:f.name, title:f.name.replace(/\.[a-z0-9]+$/i,"")}).then(function(book){
        var id = P.uid();
        var rec = { id:id, title:(book.title||f.name.replace(/\.[a-z0-9]+$/i,"")).slice(0,220),
          author:book.author||"", file:f.name, size:f.size, fmt:book.kind||"book",
          added:P.now(), lastOpen:0, progress:0, pos:{ch:0,ratio:0}, shelves:[], finished:false, ownSet:null };
        P.books.unshift(rec);
        return P.Store.setBlob("book:"+id, buf).then(function(){
          return extractCover(book);
        }).then(function(c){
          return storeCover(id, c);
        }).then(function(){
          attachPending(rec);
          releaseBook(book);
          okN++;
        });
      });
    }).catch(function(e){
      badN++;
      P.toast("Failed: "+f.name, 2200);
    }).then(function(){ return step(i+1); });
  }
  return step(0);
};
function releaseBook(book){
  try{ if(book && book.blobs) for(var k in book.blobs) URL.revokeObjectURL(book.blobs[k]); }catch(e){}
}
function attachPending(rec){
  var keep=[];
  P.pending.forEach(function(p){
    if(p.file===rec.file || (p.title && p.title===rec.title)){
      if(p.marks && p.marks.length) P.Store.setJSON("marks:"+rec.id, p.marks);
      if(p.pos) rec.pos = p.pos;
      if(p.progress) rec.progress = p.progress;
      if(p.shelves) rec.shelves = p.shelves;
    } else keep.push(p);
  });
  if(keep.length !== P.pending.length){ P.pending = keep; P.Store.setJSON("pending", P.pending); }
}

/* the letter a title files under; scripts keep their own alphabets */
function letterKey(title){
  var t = String(title||"").trim().replace(/^["'\u201c\u2018(\[\u2014\u2013-]+/,"");
  for(var i=0;i<t.length;i++){
    var ch = t.charAt(i), c = t.charCodeAt(i);
    if(/[0-9\u09E6-\u09EF\u0660-\u0669\u06F0-\u06F9]/.test(ch)) return "0–9";
    if(/[A-Za-z]/.test(ch)) return ch.toUpperCase();
    if(c>=0x0985 && c<=0x09B9) return ch;                 /* Bengali */
    if(c>=0x0621 && c<=0x064A) return ch;                 /* Arabic */
    if(c>=0x00C0 && c<=0x024F) return ch.toUpperCase();   /* accented Latin */
    if(/[\s\u09BE-\u09CC\u09D7\u0651\u0652.,;:!?'"()\[\]{}\u2014\u2013-]/.test(ch)) continue;
    return ch;
  }
  return "Other";
}
function groupRank(k){ return k==="0–9" ? 0 : (k==="Other" || k==="Unknown author") ? 2 : 1; }
function groupBooks(list, mode){
  var map = {}, keys = [];
  list.forEach(function(b){
    var k = mode==="author" ? (String(b.author||"").trim() || "Unknown author") : letterKey(b.title);
    if(!map[k]){ map[k]=[]; keys.push(k); }
    map[k].push(b);
  });
  keys.sort(function(a,b){ return (groupRank(a)-groupRank(b)) || P.natCmp(a,b); });
  return keys.map(function(k){ return {key:k, items:map[k]}; });
}

/* Clears everything this app put in Drive, then signs out.
   Reuses the sync module's own delete queue so other devices see the removals too. */
P.eraseDrive = function(){
  var C = window.BookwormsCloud;
  if(!C || !C.wipeAll){ P.toast("Drive sync isn't connected"); return; }
  P.toast("Erasing from Drive\u2026", 8000);
  C.wipeAll().then(function(n){
    /* Books that lived only in Drive have no file here — drop them rather than
       leave entries that open to "file missing". */
    var ghosts = P.books.filter(function(b){ return b.cloudOnly; });
    ghosts.forEach(function(b){
      delete covers[b.id];
      P.Store.delBlob("book:"+b.id)["catch"](function(){});
      P.Store.del("cover:"+b.id)["catch"](function(){});
      P.Store.del("marks:"+b.id)["catch"](function(){});
    });
    P.books = P.books.filter(function(b){ return !b.cloudOnly; });
    /* and forget the Drive links, so reconnecting starts clean */
    P.books.forEach(function(b){
      delete b.cloudId; delete b.driveFileId; delete b.driveCoverId;
      b.fileUploaded = false;
    });
    return P.Store.setJSON("books", P.books).then(function(){
      renderLibrary();
      if(C.disconnect) return C.disconnect();
      var out = D.getElementById("cloudSignOut"); if(out) out.click();
    }).then(function(){
      P.toast("Erased " + n + " file" + (n===1?"":"s") + " from Drive. Your own books are still here.", 5000);
    });
  })["catch"](function(e){
    P.toast((e && e.message) || "Couldn't erase from Drive", 5000);
  });
};

      };
    });
  },
  /* used by the Drive picker: books chosen there land through the normal import */
  importFiles:function(files){ return P.importFiles(files); },
  toast:function(msg){ P.toast(msg, 2600); },
  getCloudMeta:function(){ return P.Store.getJSON(CLOUD_META, null); },
  setCloudMeta:function(v){ return P.Store.setJSON(CLOUD_META, v); },
  getBookBytes:function(id){ return P.Store.getBlob("book:"+id); },
  getCover:function(id){ return P.Store.getStr("cover:"+id); },
  assignCloudId:function(id, cloudId){
    var b = P.books.filter(function(x){ return x.id===id; })[0];
    if(!b) return Promise.resolve();
    b.cloudId = cloudId;
    return persistBooks();
  },
  applyProfile:function(remote){
    window.__bookwormsApplyingCloud = true;
    try{
      if(remote.settings){ P.gset = Object.assign({}, P.gset, remote.settings); }
      if(remote.stats){ for(var k in remote.stats){
        var a=P.stats[k], b=remote.stats[k];
        P.stats[k] = (typeof a==="number" && typeof b==="number") ? Math.max(a,b) : (b!=null?b:a);
      } }
      if(remote.shelves && remote.shelves.length){
        var seen={}; var out=[];
        (P.shelves||[]).concat(remote.shelves).forEach(function(s){ if(!seen[s]){seen[s]=1;out.push(s);} });
        P.shelves = out;
      }
      if(remote.words && remote.words.length){
        var have={}; (P.words||[]).forEach(function(w){ have[(w.bookId||"")+"|"+String(w.w||w.word||"").toLowerCase()]=1; });
        remote.words.forEach(function(w){
          var key=(w.bookId||"")+"|"+String(w.w||w.word||"").toLowerCase();
          if(!have[key]){ P.words.push(w); have[key]=1; }
        });
      }
      if(remote.sortMode) P.gset.sort = remote.sortMode;
      if(remote.viewMode) P.gset.view = remote.viewMode;
    }catch(e){}
    return Promise.all([
      P.Store.setJSON("settings", P.gset),
      P.Store.setJSON("stats", P.stats),
      P.Store.setJSON("shelves", P.shelves),
      P.Store.setJSON("words", P.words)
    ]).then(function(){
      window.__bookwormsApplyingCloud = false;
      mergeSet(); P.applyUI(); renderLibrary();
    }, function(){ window.__bookwormsApplyingCloud = false; });
  },
  applyRemoteBook:function(remote){
    var b = P.books.filter(function(x){ return x.cloudId && x.cloudId===remote.cloudId; })[0];
    if(!b) b = P.books.filter(function(x){
      return bookKey(x)===remote.key &&
        String(x.title||"").trim().toLowerCase()===String(remote.title||"").trim().toLowerCase();
    })[0];
    if(!b) return Promise.resolve(null);
    var keep = { id:b.id, cloudOnly:!!b.cloudOnly };
    fromRemote(remote, b);
    b.id = keep.id; b.cloudOnly = keep.cloudOnly;
    return saveRemoteMarks(b.id, remote).then(persistBooks).then(function(){
      renderLibrary();
      return cloneJSON(toRemote(b, []));
    });
  },
  addCloudBook:function(remote){
    if(!remote.fileUploaded) return Promise.resolve(null);
    var exists = P.books.filter(function(x){
      return (x.cloudId && x.cloudId===remote.cloudId) ||
        (bookKey(x)===remote.key &&
         String(x.title||"").trim().toLowerCase()===String(remote.title||"").trim().toLowerCase());
    })[0];
    if(exists) return Promise.resolve(exists);
    var b = fromRemote(remote, { id:P.uid(), cloudOnly:true });
    P.books.unshift(b);
    return saveRemoteMarks(b.id, remote).then(persistBooks).then(function(){
      renderLibrary(); return b;
    });
  },
  removeCloudBook:function(cloudId){
    var b = P.books.filter(function(x){ return x.cloudId===cloudId; })[0];
    if(!b) return Promise.resolve(false);
    P.books = P.books.filter(function(x){ return x.id!==b.id; });
    delete covers[b.id];
    return Promise.all([
      P.Store.delBlob("book:"+b.id).catch(function(){}),
      P.Store.del("cover:"+b.id).catch(function(){}),
      P.Store.del("marks:"+b.id).catch(function(){})
    ]).then(persistBooks).then(function(){ renderLibrary(); return true; });
  },
  installCloudFile:function(id, bytes, cover){
    var b = P.books.filter(function(x){ return x.id===id; })[0];
    if(!b) return Promise.reject(new Error("That book is no longer on the shelf"));
    return P.Store.setBlob("book:"+id, bytes).then(function(){
      if(cover) return storeCover(id, cover);
    }).then(function(){
      b.cloudOnly = false;
      b.size = (bytes && (bytes.length || bytes.byteLength)) || b.size || 0;
      return persistBooks();
    }).then(function(){ renderLibrary(); return b; });
  }
};

/* a folder can hold anything; keep the books, drop what is already on the shelf */
P.importFolder = function(files){
  var all = Array.prototype.slice.call(files||[]);
  if(!all.length) return Promise.resolve();
  var books = all.filter(function(f){ return BOOK_EXT.test(f.name||"") && f.size>0; });
  var seen = {}, fresh = [], dup = 0, copies = 0;
  books.forEach(function(f){
    var k = (f.name||"")+":"+f.size;
    if(seen[k]){ copies++; return; }   /* the same book twice inside the folder */
    seen[k] = 1;
    var here = P.books.some(function(b){ return b.file===f.name && Math.abs((b.size||0)-f.size)<32; });
    if(here) dup++; else fresh.push(f);
  });
  if(!books.length){ P.toast("No books found in that folder", 3000); return Promise.resolve(); }
  if(!fresh.length){ P.toast(books.length+" found · all already on your shelf", 3400); return Promise.resolve(); }
  if(fresh.length>150) P.toast("Large folder — this will take a few minutes", 3000);
  var sh = P.sheet({ title:"Found "+fresh.length+(fresh.length===1?" book":" books"), build:function(bd){
    var lines = [ fresh.length+" new "+(fresh.length===1?"book":"books")+" to import" ];
    if(dup) lines.push(dup+" already on your shelf");
    if(copies) lines.push(copies+" duplicate "+(copies===1?"copy":"copies")+" in the folder");
    if(all.length-books.length) lines.push((all.length-books.length)+" other "+(all.length-books.length===1?"file":"files")+" skipped");
    var info = el("div","sub", lines.join(" · "));
    info.style.cssText = "padding:4px 0 12px";
    bd.appendChild(info);
    var names = el("div"); names.style.cssText="max-height:190px;overflow:auto;margin-bottom:14px";
    fresh.slice(0,40).forEach(function(f){
      var r = el("div","sub", (f.webkitRelativePath||f.name));
      r.style.cssText = "padding:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis";
      names.appendChild(r);
    });
    if(fresh.length>40) names.appendChild(el("div","sub","… and "+(fresh.length-40)+" more"));
    bd.appendChild(names);
    var go = el("button","btn","Import "+fresh.length);
    go.style.cssText = "width:100%;padding:13px;border-radius:13px;border:0;background:var(--acc);color:var(--acc-ink);font-weight:600;font-size:15px";
    go.onclick = function(){ P.closeSheet(sh); P.importFiles(fresh); };
    bd.appendChild(go);
  }});
  return Promise.resolve();
};

function openTabbed(tab, prefill){
  var bk = P.curBook; if(!bk) return;
  var tabs = el("div","tabs");
  var sh;
  var names = [["toc","Contents"],["marks","Marks"],["search","Search"]];
  function draw(){
    var b = sh.__body; b.innerHTML="";
    Array.prototype.forEach.call(tabs.children, function(c,i){ c.classList.toggle("on", names[i][0]===tab); });
    if(tab==="toc"){
      var toc = (bk.toc && bk.toc.length)? bk.toc : bk.spine.map(function(s,i){ return {label:s.label||("Section "+(i+1)), idx:i, depth:0}; });
      var curI = P.tocCurrent(toc);
      toc.forEach(function(t, i){
        var x = el("button","tocitem"+(i===curI?" cur":""), t.label||"—");
        x.style.paddingLeft = (2+(t.depth||0)*14)+"px";
        x.onclick=function(){ P.closeSheet(sh); P.gotoToc(t); };
        b.appendChild(x);
      });
    } else if(tab==="marks"){
      var ms = P.RS.marks.slice().sort(function(a,c){ return (a.ch-c.ch) || ((a.start||0)-(c.start||0)); });
      if(!ms.length){ b.appendChild(el("div","empty","No bookmarks or highlights yet.")); return; }
      ms.forEach(function(m){
        var x = el("button","mk");
        var q = el("div","q");
        if(m.type==="hl"){ var d=el("span","dot"); d.style.background=m.color||"#ffe27a"; q.appendChild(d); }
        q.appendChild(D.createTextNode(m.text||"(bookmark)"));
        x.appendChild(q);
        x.appendChild(el("div","m", (m.label||"")+(m.note? " · note":"")));
        x.onclick = function(){
          P.closeSheet(sh);
          if(m.type==="bm") P.renderChapter(m.ch, m.ratio||0);
          else P.gotoHit({ch:m.ch, snip:m.text, q:m.text});
        };
        b.appendChild(x);
      });
    } else {
      var row = el("div"); row.style.cssText="display:flex;gap:8px;margin-bottom:10px";
      var inp = el("input"); inp.placeholder="Find in this book…"; inp.value = prefill||"";
      inp.style.cssText="flex:1;padding:11px;border-radius:11px;background:var(--surf2);border:1px solid var(--line);outline:none";
      var go = el("button","btn pri","Find");
      row.appendChild(inp); row.appendChild(go); b.appendChild(row);
      var res = el("div"); b.appendChild(res);
      function run(){
        var q = inp.value.trim(); if(!q) return;
        res.innerHTML = ""; res.appendChild(el("div","empty","Searching…"));
        P.searchBook(bk, q, 200).then(function(hits){
          res.innerHTML="";
          if(!hits.length){ res.appendChild(el("div","empty","No matches.")); return; }
          res.appendChild(el("div","sechd", hits.length+" matches"));
          hits.forEach(function(h){
            var x = el("button","mk");
            x.appendChild(el("div","q", "…"+h.snip+"…"));
            x.appendChild(el("div","m", h.label));
            x.onclick=function(){ P.closeSheet(sh); P.gotoHit(h); };
            res.appendChild(x);
          });
        });
      }
      go.onclick = run;
      inp.onkeydown = function(e){ if(e.key==="Enter") run(); };
      setTimeout(function(){ try{ inp.focus(); }catch(e){} if(prefill) run(); }, 240);
    }
  }
  names.forEach(function(n){
    var t = el("button", null, n[1]);
    t.onclick = function(){ tab=n[0]; draw(); };
    tabs.appendChild(t);
  });
  sh = P.sheet({ title:"In this book", tabsEl:tabs, build:function(){} });
  draw();
}

function marksMD(groups){
  var out = ["# বইয়ের পোকা — reading marks", ""];
  groups.forEach(function(g){
    if(!g.marks.length) return;
    out.push("## "+(g.rec.title||"Untitled"));
    if(g.rec.author) out.push("*"+g.rec.author+"*");
    out.push("");
    g.marks.slice().sort(function(a,b){ return a.ch-b.ch; }).forEach(function(m){
      if(m.type==="bm") out.push("- 🔖 **"+(m.label||"")+"** — "+(m.text||"").slice(0,160));
      else{
        out.push("> "+(m.text||"").replace(/\n/g," "));
        out.push("");
        out.push("— "+(m.label||"")+(m.note? "  \n  Note: "+m.note : ""));
      }
      out.push("");
    });
  });
  return out.join("\n");
}
function downloadMD(text, name){
  try{
    var b = new Blob([text], {type:"text/markdown;charset=utf-8"});
    var u = URL.createObjectURL(b);
    var a = D.createElement("a"); a.href=u; a.download=name; D.body.appendChild(a); a.click();
    setTimeout(function(){ D.body.removeChild(a); URL.revokeObjectURL(u); }, 1200);
    P.toast("Exported");
  }catch(e){ P.toast("Export is not available here"); }
}
function allMarks(){
  var jobs = P.books.map(function(b){
    return P.loadMarks(b.id).then(function(m){ return {rec:b, marks:m||[]}; });
  });
  return Promise.all(jobs);
}
function sheetAllMarks(){
  var sh = P.sheet({ title:"All marks", action:{label:"Export", fn:function(){
    allMarks().then(function(g){ downloadMD(marksMD(g), "bookworms-marks.md"); });
  }}, build:function(bd){
    bd.appendChild(el("div","empty","Loading…"));
    allMarks().then(function(groups){
      bd.innerHTML="";
      var any=false;
      groups.forEach(function(g){
        if(!g.marks.length) return;
        any=true;
        bd.appendChild(el("div","sechd", g.rec.title));
        g.marks.forEach(function(m){
          var x = el("button","mk");
          var q = el("div","q");
          if(m.type==="hl"){ var d=el("span","dot"); d.style.background=m.color||"#ffe27a"; q.appendChild(d); }
          q.appendChild(D.createTextNode(m.text||"(bookmark)"));
          x.appendChild(q);
          x.appendChild(el("div","m",(m.label||"")+(m.note? " · "+m.note:"")));
          x.onclick = function(){
            P.closeSheet(sh);
            var id = g.rec.id;
            P.openBook(id).then(function(ok){
              if(!ok || !P.curBook || P.curBook.id!==id) return;
              if(m.type==="bm") P.renderChapter(m.ch, m.ratio||0);
              else P.gotoHit({ch:m.ch, snip:m.text, q:m.text});
            });
          };
          bd.appendChild(x);
        });
      });
      if(!any) bd.appendChild(el("div","empty","No highlights or bookmarks yet."));
    });
  }});
}

function sheetLibSearch(){
  var sh = P.sheet({ title:"Search inside all books", build:function(bd){
    var row = el("div"); row.style.cssText="display:flex;gap:8px;margin-bottom:10px";
    var inp = el("input"); inp.placeholder="Word or phrase…";
    inp.style.cssText="flex:1;padding:11px;border-radius:11px;background:var(--surf2);border:1px solid var(--line);outline:none";
    var go = el("button","btn pri","Search");
    row.appendChild(inp); row.appendChild(go); bd.appendChild(row);
    var out = el("div"); bd.appendChild(out);
    var cancelled=false;
    go.onclick = function(){
      var q = inp.value.trim(); if(!q) return;
      out.innerHTML=""; cancelled=false;
      var prog = el("div","empty","Searching 0 / "+P.books.length);
      out.appendChild(prog);
      var i=0, total=0;
      function next(){
        if(cancelled || i>=P.books.length){ prog.textContent = total? total+" matches in "+P.books.length+" books" : "No matches."; return; }
        var rec = P.books[i++];
        prog.textContent = "Searching "+i+" / "+P.books.length+" — "+rec.title;
        P.Store.getBlob("book:"+rec.id).then(function(buf){
          if(!buf) return null;
          return P.openBuffer(buf, {name:rec.file||rec.title, title:rec.title});
        }).then(function(book){
          if(!book) return;
          book.id = rec.id;
          return P.searchBook(book, q, 8).then(function(hits){
            if(hits.length){
              var head = el("div","sechd", rec.title+" · "+hits.length);
              out.insertBefore(head, prog);
              hits.forEach(function(h){
                total++;
                var x = el("button","mk");
                x.appendChild(el("div","q","…"+h.snip+"…"));
                x.appendChild(el("div","m", h.label));
                x.onclick = function(){
                  P.closeSheet(sh);
                  var id = rec.id;
                  P.openBook(id).then(function(ok){
                    if(!ok || !P.curBook || P.curBook.id!==id) return;
                    P.gotoHit(h);
                  });
                };
                out.insertBefore(x, prog);
              });
            }
            releaseBook(book);
          });
        }).catch(function(){}).then(function(){ setTimeout(next, 10); });
      }
      next();
    };
    inp.onkeydown = function(e){ if(e.key==="Enter") go.onclick(); };
    setTimeout(function(){ try{ inp.focus(); }catch(e){} }, 240);
  }});
}

function backup(){
  allMarks().then(function(groups){
    var data = {
      v:1, at:P.now(), settings:P.gset, shelves:P.shelves, stats:P.stats, words:P.words,
      books: P.books.map(function(b){
        var g = groups.filter(function(x){ return x.rec.id===b.id; })[0];
        var o = strip(b); o.marks = g? g.marks : [];
        return o;
      })
    };
    try{
      var blob = new Blob([JSON.stringify(data)], {type:"application/json"});
      var u = URL.createObjectURL(blob);
      var a = D.createElement("a"); a.href=u; a.download="bookworms-backup.json";
      D.body.appendChild(a); a.click();
      setTimeout(function(){ D.body.removeChild(a); URL.revokeObjectURL(u); },1200);
      P.toast("Backup saved");
    }catch(e){ P.toast("Could not save the backup here"); }
  });
}
function restore(){
  var fp = D.getElementById("jsonPick");
  fp.onchange = function(){
    var f = fp.files && fp.files[0]; fp.value="";
    if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      var data;
      try{ data = JSON.parse(String(r.result)); }catch(e){ P.toast("That file is not a বইয়ের পোকা backup"); return; }
      if(!data || !data.books){ P.toast("That file is not a বইয়ের পোকা backup"); return; }
      if(data.settings){ P.gset = data.settings; saveSet(); }
      if(data.shelves){ P.shelves = data.shelves; P.Store.setJSON("shelves", P.shelves); }
      if(data.stats){ P.stats = data.stats; P.Store.setJSON("stats", P.stats); }
      if(data.words){ P.words = data.words; P.Store.setJSON("words", P.words); }
      var matched=0, parked=0;
      data.books.forEach(function(b){
        var here = P.books.filter(function(x){ return x.file===b.file || x.title===b.title; })[0];
        if(here){
          here.pos = b.pos||here.pos; here.progress=b.progress||here.progress;
          here.shelves=b.shelves||here.shelves; here.finished=b.finished||here.finished;
          if(b.marks && b.marks.length) P.Store.setJSON("marks:"+here.id, b.marks);
          matched++;
        }else{
          P.pending.push({ file:b.file, title:b.title, pos:b.pos, progress:b.progress, shelves:b.shelves, marks:b.marks||[] });
          parked++;
        }
      });
      P.Store.setJSON("pending", P.pending);
      P.saveBooks(true);
      mergeSet(); P.applyUI(); renderLibrary();
      P.toast(matched+" restored · "+parked+" waiting for their files", 4000);
    };
    r.readAsText(f);
  };
  fp.click();
}

/* ---------------- first-run tour ---------------- */
function tour(force){
  if(!force && P.gset.toured) return;
  var cards = [
    ["Tap the edges","Tap the left or right edge — or swipe — to turn the page. Tap the middle to show the menus."],
    ["Hold to highlight","Select any text to highlight it, add a note, copy it or save the word. Double-tap to bookmark."],
    ["Slide at the edges","Drag up and down on the left edge for brightness, on the right edge for text size."]
  ];
  var i = 0, sh;
  function draw(){
    var b = sh.__body; b.innerHTML="";
    var c = el("div","tourcard");
    c.innerHTML = '<div style="opacity:.85">'+P.logoSVG(64)+'</div><h3>'+esc(cards[i][0])+'</h3><p>'+esc(cards[i][1])+'</p>';
    b.appendChild(c);
    var dots = el("div"); dots.style.cssText="display:flex;gap:6px;justify-content:center;margin:14px 0";
    cards.forEach(function(_,n){
      var d = el("span"); d.style.cssText="width:7px;height:7px;border-radius:50%;background:"+(n===i?"var(--acc)":"#333944");
      dots.appendChild(d);
    });
    b.appendChild(dots);
    var go = el("button","btn pri", i<cards.length-1? "Next":"Start reading");
    go.style.width="100%";
    go.onclick = function(){
      if(i<cards.length-1){ i++; draw(); }
      else { P.gset.toured=true; saveSet(); P.closeSheet(sh); }
    };
    b.appendChild(go);
  }
  sh = P.sheet({ title:"Welcome to বইয়ের পোকা", build:function(){} });
  draw();
}

/* ---------------- auto night ---------------- */
function autoNight(){
  if(!P.gset.autoNight) return;
  var h = new Date().getHours();
  var want = (h>=19 || h<6)? "night" : "sepia";
  if(P.gset.theme !== want){ P.gset.theme = want; saveSet(); mergeSet(); if(P.R && P.R.reader) P.applyTheme(); }
}

/* ---------------- boot ---------------- */
function dropSplash(){
  var s = D.getElementById("splash");
  if(!s) return;
  s.classList.add("out");
  setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 500);
}
setTimeout(dropSplash, 4200);   /* failsafe: never trap the user behind the splash */

function boot(){
  try{ D.getElementById("splashMark").innerHTML = P.logoSVG(96); }catch(e){}
  P.injectIcons();
  return P.Store.ready().then(function(){
    return Promise.all([
      P.Store.getJSON("settings", {}),
      P.Store.getJSON("books", []),
      P.Store.getJSON("shelves", []),
      P.Store.getJSON("stats", {}),
      P.Store.getJSON("words", []),
      P.Store.getJSON("pending", [])
    ]);
  }).then(function(a){
    P.gset = a[0]||{}; P.books = a[1]||[]; P.shelves = a[2]||[];
    P.stats = a[3]||{}; P.words = a[4]||[]; P.pending = a[5]||[];
    if(P.gset.customTheme) P.THEMES.custom = P.gset.customTheme;
    mergeSet();
    P.applyUI();
    autoNight();
    return P.Store.getStr("customFont").then(function(f){ if(f) return loadCustomFont(f); }).catch(function(){});
  }).then(function(){
    return loadCovers();
  }).then(function(){
    buildLibrary();
    P.buildReader();
    renderLibrary();
    if(P.Store.mode() !== "idb"){
      var w = el("div","warnbar", P.Store.mode()==="mem"
        ? "Storage is unavailable here — books will disappear when you close this page."
        : "Using fallback storage — large books may load more slowly.");
      var host = D.getElementById("warnHost"); if(host) host.appendChild(w);
    }
    dropSplash();
    setTimeout(function(){ tour(false); }, 700);
    if(P.gset.autoResume!==false){
      var last = P.books.slice().sort(function(a,b){ return (b.lastOpen||0)-(a.lastOpen||0); })[0];
      if(last && last.lastOpen) setTimeout(function(){ P.openBook(last.id); }, 260);
    }
  }).catch(function(e){
    dropSplash();
    buildLibrary(); renderLibrary();
    P.toast("Started with limited storage: "+(e && e.message || e), 4000);
  });
}

/* global wiring */
D.getElementById("filePick").onchange = function(){
  var f = this.files; var self=this;
  P.importFiles(f).then(function(){ self.value=""; });
};
D.getElementById("folderPick").onchange = function(){
  var f = this.files, self = this;
  P.importFolder(f).then(function(){ self.value=""; });
};
D.getElementById("scrim").onclick = function(){ P.closeAllSheets(); };
W.addEventListener("resize", P.debounce(function(){ if(P.reading) P.relayout(true); }, 160));
W.addEventListener("orientationchange", function(){ setTimeout(function(){ if(P.reading) P.relayout(true); }, 320); });
D.addEventListener("visibilitychange", function(){ if(D.hidden && P.reading) P.saveProgress(true); });
W.addEventListener("pagehide", function(){ if(P.reading) P.saveProgress(true); });
D.addEventListener("keydown", function(e){
  if(!P.reading) return;
  if(e.key==="ArrowRight" || e.key==="PageDown" || e.key===" ") { e.preventDefault(); P.turn(1); }
  else if(e.key==="ArrowLeft" || e.key==="PageUp") { e.preventDefault(); P.turn(-1); }
  else if(e.key==="Escape") P.closeReader();
});
setInterval(autoNight, 600000);

if(D.readyState==="loading") D.addEventListener("DOMContentLoaded", boot);
else boot();
})();

</script>

<script type="module" src="./cloud-sync.js"></script>
<script>
/* keeps the app itself available offline when served over http(s);
   books never pass through the cache — they live in this device's database */
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
